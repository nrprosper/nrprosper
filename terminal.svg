<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="14" role="img" aria-label="Prosper Nishimwe — terminal intro">
  <style>
    .win   { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
    .bar   { fill: #161b22; }
    .title { font: 12px ui-monospace, SFMono-Regular, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #8b949e; }
    text   { font: 14px ui-monospace, SFMono-Regular, "DejaVu Sans Mono", Menlo, Consolas, monospace; white-space: pre; }
    .user  { fill: #3fb950; font-weight: 600; }
    .path  { fill: #58a6ff; font-weight: 600; }
    .sym   { fill: #8b949e; }
    .cmd   { fill: #e6edf3; }
    .out   { fill: #9da7b3; }
    .hi    { fill: #d2a8ff; }
    .tag   { fill: #e3b341; }
    .dim   { fill: #6e7681; }
    .g { animation: in .45s ease-out both; }
    .g1 { animation-delay: .2s }  .g2 { animation-delay: .7s }
    .g3 { animation-delay: 1.2s } .g4 { animation-delay: 1.7s }
    .g5 { animation-delay: 2.2s } .g6 { animation-delay: 2.7s }
    .cursor { fill: #3fb950; animation: in .45s ease-out 2.7s both, blink 1.1s steps(1) 3.2s infinite; }
    @keyframes in    { from { opacity: 0; transform: translateY(4px) } to { opacity: 1; transform: none } }
    @keyframes blink { 50% { opacity: 0 } }
  </style>

  <!-- window -->
  <rect class="win" x="0.5" y="0.5" width="819" height="439" rx="10"/>
  <path class="bar" d="M10.5 0.5h799a10 10 0 0 1 10 10v25.5h-819v-25.5a10 10 0 0 1 10-10z"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text class="title" x="410" y="22" text-anchor="middle">prosper@dev: ~</text>

  <g class="g g1">
    <text x="24" y="72"><tspan class="user">prosper@dev</tspan><tspan class="sym">:</tspan><tspan class="path">~</tspan><tspan class="sym">$ </tspan><tspan class="cmd">whoami</tspan></text>
    <text x="24" y="94" class="out"><tspan class="cmd">Prosper Nishimwe</tspan> — full-stack developer. Fluent in TypeScript, Java &amp; comfortable silence.</text>
  </g>

  <g class="g g2">
    <text x="24" y="134"><tspan class="user">prosper@dev</tspan><tspan class="sym">:</tspan><tspan class="path">~</tspan><tspan class="sym">$ </tspan><tspan class="cmd">cat focus.txt</tspan></text>
    <text x="24" y="156" class="out">Currently building health information systems <tspan class="hi">@hisprwanda</tspan></text>
  </g>

  <g class="g g3">
    <text x="24" y="196"><tspan class="user">prosper@dev</tspan><tspan class="sym">:</tspan><tspan class="path">~</tspan><tspan class="sym">$ </tspan><tspan class="cmd">ls ~/stack</tspan></text>
    <text x="24" y="218" class="path">typescript  nestjs  nextjs  springboot  postgresql  docker  rabbitmq  github-actions  linux</text>
  </g>

  <g class="g g4">
    <text x="24" y="258"><tspan class="user">prosper@dev</tspan><tspan class="sym">:</tspan><tspan class="path">~</tspan><tspan class="sym">$ </tspan><tspan class="cmd">./now --building</tspan></text>
    <text x="24" y="280" class="out"><tspan class="hi">reactor</tspan>   a GNOME top-bar HUD for containers, queues &amp; CI   <tspan class="tag">[open source soon]</tspan></text>
  </g>

  <g class="g g5">
    <text x="24" y="320"><tspan class="user">prosper@dev</tspan><tspan class="sym">:</tspan><tspan class="path">~</tspan><tspan class="sym">$ </tspan><tspan class="cmd">cat ~/.motto</tspan></text>
    <text x="24" y="342" class="out"><tspan class="dim"># </tspan>Less noise, more signal.</text>
  </g>

  <g class="g g6">
    <text x="24" y="382"><tspan class="user">prosper@dev</tspan><tspan class="sym">:</tspan><tspan class="path">~</tspan><tspan class="sym">$ </tspan></text>
  </g>
  <rect class="cursor" x="152" y="370" width="9" height="17" rx="1"/>
</svg>
